[package]
name = "well_array_sim_core"
version = "0.1.0"
edition = "2021"
description = "Rust kernels for well-array-beamforming-sim axial scan export"

[lib]
name = "well_array_sim_core"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.16"
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }
rand = "0.8"
rand_distr = "0.4"
rand_pcg = "0.3"
rayon = "1.10"
rustfft = "6.2"

[profile.release]
lto = true
codegen-units = 1
