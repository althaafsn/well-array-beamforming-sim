[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "well-array-beamforming-sim"
version = "0.2.0"
description = "Internal pipe pulse-echo simulator: ray physics, angular SAFT, BC pipeline studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
well-array-sim = "well_array_sim.cli:main"
well-array-sim-gui = "well_array_sim.gui:main"
well-array-sim-om = "well_array_sim.om_gui:main"
well-array-sim-export = "well_array_sim.cli:main_export_partition"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".venv"]
