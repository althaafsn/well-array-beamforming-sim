<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waveform 2D — Live Ripple Tank</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Waveform 2D <span class="sub">live FDTD ripple tank</span></h1>
      <div class="status"><span id="dot" class="dot"></span><span id="status">connecting…</span></div>
    </header>

    <div class="stage">
      <canvas id="view" width="240" height="240"></canvas>
      <p class="hint">click the field to drop a ripple · shift-click to place an oscillator</p>
    </div>

    <aside class="panel">
      <label>Scene
        <select id="scene"></select>
      </label>

      <label>Colour scheme
        <select id="colormap"></select>
      </label>

      <label>Frequency <span id="freqval" class="val"></span>
        <input id="frequency" type="range" min="0.4" max="2.4" step="0.05" value="1.0" />
      </label>

      <label>Brightness <span id="brightval" class="val"></span>
        <input id="brightness" type="range" min="0.05" max="1.2" step="0.01" value="0.4" />
      </label>

      <label class="check">
        <input id="absorbing" type="checkbox" checked /> absorbing edges
      </label>

      <div class="buttons">
        <button id="pause">Pause</button>
        <button id="clear">Clear sources</button>
        <button id="reset">Reset</button>
      </div>

      <p class="fps"><span id="fps">–</span> fps</p>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
