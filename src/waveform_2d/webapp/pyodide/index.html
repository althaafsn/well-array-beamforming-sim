<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waveform 2D — Live Ripple Tank (Python / Pyodide)</title>
<style>
  :root{--bg:#0b0e16;--panel:#151a27;--edge:#232a3d;--text:#d7def0;--muted:#8a93ac;--accent:#4fd0e0;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 30% -10%,#131a2c,var(--bg));color:var(--text);min-height:100vh;}
  .app{max-width:1100px;margin:0 auto;padding:28px 20px 48px;display:grid;
    grid-template-columns:1fr 300px;grid-template-rows:auto 1fr;gap:20px 28px;}
  header{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;}
  h1{font-size:22px;font-weight:650;margin:0;}
  h1 .sub{font-size:13px;color:var(--muted);font-weight:400;margin-left:10px;}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .dot{width:9px;height:9px;border-radius:50%;background:#c0504d;box-shadow:0 0 8px #c0504d;}
  .dot.on{background:#57c785;box-shadow:0 0 8px #57c785;}
  .stage{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;}
  .canvas-wrap{position:relative;}
  canvas{width:min(64vw,620px);height:min(64vw,620px);border-radius:12px;border:1px solid var(--edge);
    box-shadow:0 12px 40px rgba(0,0,0,.45);background:#06080f;touch-action:none;}
  canvas.tool-ripple,canvas.tool-oscillator{cursor:crosshair;}
  canvas.tool-block{cursor:cell;}
  canvas.tool-circle,canvas.tool-hollow,canvas.tool-pipe{cursor:pointer;}
  canvas.tool-erase{cursor:not-allowed;}
  .hint{color:var(--muted);font-size:12.5px;margin:0;text-align:center;max-width:620px;line-height:1.45;}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:18px;
    display:flex;flex-direction:column;gap:14px;height:fit-content;}
  .section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 -6px;}
  label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted);}
  label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text);}
  label.hidden{display:none;}
  select,input[type=range]{width:100%;}
  select{background:#0e1320;color:var(--text);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:13px;}
  input[type=range]{accent-color:var(--accent);}
  .val{color:var(--accent);font-variant-numeric:tabular-nums;}
  .buttons{display:flex;gap:8px;flex-wrap:wrap;}
  button{flex:1;min-width:70px;background:#1d2436;color:var(--text);border:1px solid var(--edge);border-radius:8px;
    padding:9px 8px;font-size:12.5px;cursor:pointer;transition:background .15s,border-color .15s;}
  button:hover{background:#27314a;border-color:var(--accent);}
  .fps{margin:0;font-size:12px;color:var(--muted);text-align:right;}
  .fps #fps,.fps #sps{color:var(--accent);font-variant-numeric:tabular-nums;}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    border-radius:12px;background:rgba(6,8,15,.82);color:var(--text);font-size:14px;text-align:center;padding:20px;}
  .spinner{width:26px;height:26px;border:3px solid var(--edge);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(max-width:820px){.app{grid-template-columns:1fr;}canvas{width:92vw;height:92vw;}}
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Waveform 2D <span class="sub">Python FDTD · draw structures on the field</span></h1>
      <div class="status"><span id="dot" class="dot"></span><span id="status">booting…</span></div>
    </header>

    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="view" width="180" height="180"></canvas>
        <div id="overlay" class="overlay"><div><div class="spinner"></div><span id="boot">loading Python runtime…</span></div></div>
      </div>
      <p class="hint" id="hint">Select a draw tool, then click or drag on the field. <b>Ripple</b> = click to drop a wave.</p>
    </div>

    <aside class="panel">
      <div class="section">Scene</div>
      <label>Scene<select id="scene"></select></label>
      <label>Colour scheme<select id="colormap"></select></label>

      <div class="section">Draw tool</div>
      <label>Tool<select id="tool">
        <option value="ripple">ripple (click)</option>
        <option value="oscillator">oscillator (click)</option>
        <option value="block">block / wall (drag)</option>
        <option value="circle">solid circle (click)</option>
        <option value="hollow">hollow circle / ring (click)</option>
        <option value="pipe">pipe ring (click)</option>
        <option value="erase">eraser (click)</option>
      </select></label>
      <label id="lbl-size">Size (radius) <span id="sizeval" class="val">0.15</span>
        <input id="size" type="range" min="0.05" max="0.45" step="0.01" value="0.15" /></label>
      <label id="lbl-wall">Wall thickness <span id="wallval" class="val">18%</span>
        <input id="wallthick" type="range" min="0.08" max="0.35" step="0.01" value="0.18" /></label>

      <div class="section">Simulation</div>
      <label>Speed <span id="speedval" class="val">240 steps/s</span>
        <input id="speed" type="range" min="1" max="10" step="1" value="4" /></label>
      <label>Frequency <span id="freqval" class="val">1.00</span>
        <input id="frequency" type="range" min="0.4" max="2.4" step="0.05" value="1.0" /></label>
      <label>Brightness <span id="brightval" class="val">0.40</span>
        <input id="brightness" type="range" min="0.05" max="1.2" step="0.01" value="0.4" /></label>
      <label class="check"><input id="absorbing" type="checkbox" checked /> absorbing edges</label>

      <div class="buttons">
        <button id="pause">Pause</button>
        <button id="clear">Clear waves</button>
        <button id="cleargeo">Clear structures</button>
        <button id="reset">Reset scene</button>
      </div>
      <p class="fps"><span id="fps">–</span> fps &nbsp;·&nbsp; <span id="sps">–</span> sim steps/s</p>
    </aside>
  </div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const W = 180, H = 180;
const MIN_STEPS_PER_SEC = 60, MAX_STEPS_PER_SEC = 1200, MAX_STEPS_PER_FRAME = 60;

const view = document.getElementById("view");
const ctx = view.getContext("2d");
const off = document.createElement("canvas"); off.width = W; off.height = H;
const offCtx = off.getContext("2d");
const imgData = offCtx.createImageData(W, H);
const $ = (id) => document.getElementById(id);

let sim = null, running = true;
let stepsPerSec = 240, accumMs = 0, lastTime = null;
let frames = 0, simSteps = 0, lastFps = performance.now();

// pointer state for block drag
let dragging = false, dragX0 = 0, dragY0 = 0;

const HINTS = {
  ripple: "<b>Ripple</b> — click to drop a transient wave.",
  oscillator: "<b>Oscillator</b> — click to place a continuous wave source.",
  block: "<b>Block</b> — click and drag to draw a reflecting wall (rectangle).",
  circle: "<b>Solid circle</b> — click to place a reflecting disk. Adjust <i>Size</i>.",
  hollow: "<b>Hollow circle</b> — click to place a steel pipe ring (water inside). Adjust <i>Size</i> and <i>Wall thickness</i>.",
  pipe: "<b>Pipe ring</b> — same as hollow circle; sized for pipe cross-sections.",
  erase: "<b>Eraser</b> — click a structure to remove it.",
};

function setStatus(t, on){ $("status").textContent = t; $("dot").classList.toggle("on", !!on); }

function relCoords(ev){
  const r = view.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height };
}

function updateToolUI(){
  const t = $("tool").value;
  view.className = "tool-" + t;
  $("hint").innerHTML = HINTS[t] || "";
  const needsSize = ["circle","hollow","pipe"].includes(t);
  const needsWall = ["hollow","pipe"].includes(t);
  $("lbl-size").classList.toggle("hidden", !needsSize);
  $("lbl-wall").classList.toggle("hidden", !needsWall);
}

function getSize(){ return +$("size").value; }
function getWallFrac(){ return +$("wallthick").value; }

function placeStructure(x, y, x1, y1){
  const tool = $("tool").value;
  const r = getSize();
  const wf = getWallFrac();
  if (tool === "ripple") sim.add_drip(x, y);
  else if (tool === "oscillator") sim.add_oscillator(x, y);
  else if (tool === "block") sim.add_wall_block(x, y, x1 ?? x, y1 ?? y);
  else if (tool === "circle") sim.add_wall_circle(x, y, r);
  else if (tool === "hollow") sim.add_steel_ring(x, y, r, r * (1 - wf));
  else if (tool === "pipe") sim.add_steel_pipe(x, y, r, wf);
  else if (tool === "erase") sim.erase_at(x, y);
}

async function boot(){
  $("boot").textContent = "loading Python runtime…";
  const pyodide = await loadPyodide();
  await pyodide.loadPackage("numpy");
  const code = await (await fetch("./wave_engine.py?v=4")).text();
  pyodide.runPython(code);
  pyodide.runPython(`sim = LiveSimulation(${W}, ${H})`);
  sim = pyodide.globals.get("sim");

  pyodide.runPython("list(SCENES)").toJs().forEach((s) =>
    $("scene").add(new Option(s.replace("_", " "), s)));
  pyodide.runPython("colormaps()").toJs().forEach((c) =>
    $("colormap").add(new Option(c, c)));

  $("overlay").style.display = "none";
  setStatus("live", true);
  updateToolUI();
  requestAnimationFrame(loop);
}

function loop(now){
  if (lastTime === null) lastTime = now;
  const dtMs = Math.min(now - lastTime, 100);
  lastTime = now;

  if (sim && running){
    accumMs += dtMs;
    const msPerStep = 1000 / stepsPerSec;
    let steps = Math.min(Math.floor(accumMs / msPerStep), MAX_STEPS_PER_FRAME);
    accumMs -= steps * msPerStep;
    if (steps > 0){ sim.step(steps); simSteps += steps; }

    const proxy = sim.render();
    imgData.data.set(proxy.toJs());
    proxy.destroy();
    offCtx.putImageData(imgData, 0, 0);
    ctx.drawImage(off, 0, 0, W, H);

    // drag preview for blocks
    if (dragging && $("tool").value === "block"){
      const {x,y} = relCoords({clientX: dragX1, clientY: dragY1});
      const sx = dragX0 * view.width, sy = dragY0 * view.height;
      const ex = x * view.width, ey = y * view.height;
      ctx.strokeStyle = "rgba(79,208,224,0.9)";
      ctx.lineWidth = 2;
      ctx.strokeRect(Math.min(sx,ex), Math.min(sy,ey), Math.abs(ex-sx), Math.abs(ey-sy));
    }
    frames++;
  }

  const elapsed = now - lastFps;
  if (elapsed > 1000){
    $("fps").textContent = (frames * 1000 / elapsed).toFixed(0);
    $("sps").textContent = (simSteps * 1000 / elapsed).toFixed(0);
    frames = 0; simSteps = 0; lastFps = now;
  }
  requestAnimationFrame(loop);
}

let dragX1 = 0, dragY1 = 0;

// pointer handlers
view.addEventListener("pointerdown", (ev) => {
  if (!sim) return;
  ev.preventDefault();
  const {x,y} = relCoords(ev);
  if ($("tool").value === "block"){
    dragging = true;
    dragX0 = x; dragY0 = y;
    dragX1 = ev.clientX; dragY1 = ev.clientY;
    view.setPointerCapture(ev.pointerId);
  } else {
    placeStructure(x, y);
  }
});

view.addEventListener("pointermove", (ev) => {
  if (dragging){ dragX1 = ev.clientX; dragY1 = ev.clientY; }
});

view.addEventListener("pointerup", (ev) => {
  if (!dragging || !sim) return;
  const {x,y} = relCoords(ev);
  placeStructure(dragX0, dragY0, x, y);
  dragging = false;
  try { view.releasePointerCapture(ev.pointerId); } catch(_){}
});

view.addEventListener("pointercancel", () => { dragging = false; });

// panel controls
$("scene").onchange = (e) => sim && sim.set_scene(e.target.value);
$("colormap").onchange = (e) => sim && sim.set_param("colormap", e.target.value);
$("tool").onchange = updateToolUI;
$("size").oninput = (e) => $("sizeval").textContent = (+e.target.value).toFixed(2);
$("wallthick").oninput = (e) => $("wallval").textContent = Math.round(+e.target.value * 100) + "%";
$("frequency").oninput = (e) => { $("freqval").textContent = (+e.target.value).toFixed(2); sim && sim.set_param("frequency", +e.target.value); };
$("brightness").oninput = (e) => { $("brightval").textContent = (+e.target.value).toFixed(2); sim && sim.set_param("brightness", +e.target.value); };
$("absorbing").onchange = (e) => sim && sim.set_param("absorbing", e.target.checked);
$("speed").oninput = (e) => {
  const t = (+e.target.value - 1) / 9;
  stepsPerSec = Math.round(MIN_STEPS_PER_SEC * Math.pow(MAX_STEPS_PER_SEC / MIN_STEPS_PER_SEC, t));
  $("speedval").textContent = stepsPerSec + " steps/s";
  accumMs = 0;
};
$("pause").onclick = (e) => {
  running = !running;
  e.target.textContent = running ? "Pause" : "Play";
  if (running){ lastTime = null; accumMs = 0; }
};
$("clear").onclick = () => sim && sim.clear_sources();
$("cleargeo").onclick = () => sim && sim.clear_structures();
$("reset").onclick = () => sim && sim.reset();

$("sizeval").textContent = getSize().toFixed(2);
$("wallval").textContent = Math.round(getWallFrac() * 100) + "%";
setStatus("booting…", false);
boot().catch((err) => { $("boot").textContent = "failed: " + err; setStatus("error", false); console.error(err); });
</script>
</body>
</html>
